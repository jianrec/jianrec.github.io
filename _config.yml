title: 周健 | Jian Zhou
description: 应用统计硕士在读，研究兴趣为 LLM、LLM4Rec 与 Agent 系统
url: "https://jianrec.github.io"
baseurl: ""
lang: "zh-CN"
timezone: "Asia/Shanghai"

author:
  name: 周健
  email: ""

entry_link:
  text: "← 学术主页"
  url: "#"

waline_server: ""
reaction_api: ""

traffic:
  busuanzi: true

comments:
  provider: "utterances"
  utterances:
    repo: "jianrec/jianrec.github.io"
    issue_term: "pathname"
    label: "comment"
    theme: "preferred-color-scheme"

markdown: kramdown
permalink: /posts/:year-:month-:day-:title/

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore

collections:
  notes:
    output: true
    permalink: /notes/:path/
  en_notes:
    output: true
    permalink: /en/notes/:path/
  en_posts:
    output: true
    permalink: /en/posts/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "周健"
      main_category: "技术随笔"
      lang: "zh"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "post"
      author: "周健"
      lang: "zh"
  - scope:
      path: ""
      type: "en_posts"
    values:
      layout: "post"
      author: "Jian Zhou"
      main_category: "Technical Notes"
      lang: "en"
  - scope:
      path: ""
      type: "en_notes"
    values:
      layout: "post"
      author: "Jian Zhou"
      lang: "en"

study_order:
  - ai-agent-learning
  - git
